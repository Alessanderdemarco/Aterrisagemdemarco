    });
    const tf = soma(IT,'falta'), to = soma(IT,'objetivo'), tg = soma(IT,'garantido');
    h += m.tipo_itens==='pds' ? `<tr class="tot"><td>Total</td><td></td><td></td><td></td><td>${nf(to)}</td><td>${nf(tg)}</td><td>${nf(tf)}</td><td></td><td></td></tr>`
                              : `<tr class="tot"><td>Total</td><td>${nf(to)}</td><td>${nf(soma(IT,'emplacado'))}</td><td>${nf(soma(IT,'a_emplacar'))}</td><td>${nf(tg)}</td><td>${nf(tf)}</td><td></td></tr>`;
    h += '</tbody></table></div>';
    if(m.tem_objetivo && m.tipo_itens==='pds') h += `<div class="leg">A falta por modelo é para a meta de PDS (participação no segmento, varejo); ela não é o objetivo de emplacamento do canal.</div>`;
    h += `<h3>Ações sugeridas</h3>` + m.acoes.filter(a=>a.loja===l.loja).map(a=>`<div class="acao"><div class="t">[${esc(a.tipo)}] ${esc(a.acao)}</div><div class="p">${esc(a.porque)} · ${nf(a.unidades)} un. em jogo</div></div>`).join('') + '</div>';
  }
  el.innerHTML = h;
}
function selMarca(k){ marca=k; loja=null; render(); }
function selLoja(l){ loja=l; render(); window.scrollTo({top:0,behavior:'smooth'}); }
render();
</script></body></html>
